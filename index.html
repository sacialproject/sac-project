<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAC PROJECT · Social Adaptation Capital</title>
<meta name="description" content="Open theory and bilingual assessment of adaptation meta-skills. Открытая теория и двуязычная диагностика метанавыков адаптации.">
<meta name="author" content="SAC PROJECT · sacialproject@gmail.com">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
:root{
  --bg:#080b14;--bg2:#0f1522;--card:#131a2b;--card2:#1a2136;
  --ink:#eef2ff;--muted:#8894b0;--line:#232c44;
  --accent:#7c8cff;--accent2:#b57cff;
  --good:#22d3a5;--mid:#f5b942;--low:#ff6b7a;--soft:#151c30;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:
    radial-gradient(circle at 15% 10%, rgba(124,140,255,.16), transparent 40%),
    radial-gradient(circle at 85% 90%, rgba(181,124,255,.12), transparent 45%),
    var(--bg);
  color:var(--ink);line-height:1.55;min-height:100vh;
  padding:20px 12px 60px;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:980px;margin:0 auto;}
.pwrap{position:fixed;top:0;left:0;right:0;height:3px;z-index:99;background:rgba(255,255,255,.05);}
.pbar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s ease;box-shadow:0 0 12px rgba(124,140,255,.6);}

/* LANG SWITCH */
.lang-switch{
  position:fixed;top:16px;right:16px;z-index:1000;
  display:flex;background:rgba(19,26,43,.92);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:999px;padding:4px;
  box-shadow:0 8px 24px -8px rgba(0,0,0,.6);
}
.lang-switch button{
  border:none;background:transparent;color:var(--muted);
  padding:7px 16px;border-radius:999px;cursor:pointer;
  font-size:.78rem;font-weight:700;letter-spacing:.05em;
  font-family:inherit;transition:.2s;
}
.lang-switch button.on{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;box-shadow:0 4px 12px -4px rgba(124,140,255,.6);
}

/* HERO */
.hero{text-align:center;padding:80px 20px 50px;position:relative;overflow:hidden;}
.hero::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 30%, rgba(124,140,255,.18), transparent 60%);
  pointer-events:none;animation:shift 18s ease-in-out infinite;
}
@keyframes shift{
  0%,100%{transform:translate(0,0) scale(1);}
  50%{transform:translate(2%,-2%) scale(1.05);}
}
.hero-inner{position:relative;z-index:1;}
.hero .logo{
  display:inline-flex;align-items:center;gap:10px;
  padding:6px 16px;border:1px solid var(--line);border-radius:999px;
  font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;
  color:var(--muted);margin-bottom:24px;background:rgba(19,26,43,.7);
  backdrop-filter:blur(8px);
}
.hero .logo .dot{
  width:8px;height:8px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 12px var(--accent);animation:pulse 2s infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.5;transform:scale(.8);}}
.hero h1{
  font-size:clamp(2rem,5.5vw,3.6rem);letter-spacing:-.04em;font-weight:800;
  line-height:1.05;margin-bottom:20px;
  background:linear-gradient(135deg,#fff 20%,#a5b4fc 60%,#c4b5fd 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  max-width:820px;margin-left:auto;margin-right:auto;
}
.hero p{
  color:#a8b2cc;font-size:clamp(1rem,1.4vw,1.15rem);
  max-width:640px;margin:0 auto 32px;
}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-bottom:56px;}
.hero .stats{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
  gap:24px;max-width:760px;margin:0 auto;
  padding-top:32px;border-top:1px solid var(--line);
}
.hero .stat .v{
  font-size:1.8rem;font-weight:800;letter-spacing:-.03em;
  background:linear-gradient(135deg,#fff,#a5b4fc);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero .stat .l{
  font-size:.72rem;color:var(--muted);text-transform:uppercase;
  letter-spacing:.08em;margin-top:4px;
}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:15px 28px;border-radius:14px;
  font-size:.95rem;font-weight:600;
  text-decoration:none;cursor:pointer;border:none;
  font-family:inherit;transition:.25s;
}
.btn-p{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;box-shadow:0 12px 32px -10px rgba(124,140,255,.7);
}
.btn-p:hover{transform:translateY(-3px);box-shadow:0 18px 40px -12px rgba(124,140,255,.9);}
.btn-g{
  background:rgba(19,26,43,.6);color:var(--ink);
  border:1px solid var(--line);backdrop-filter:blur(8px);
}
.btn-g:hover{border-color:var(--accent);color:var(--accent);}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important;}

/* CARDS */
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:18px;padding:26px;margin-bottom:18px;
  box-shadow:0 20px 40px -25px rgba(0,0,0,.7);
  animation:slide .35s ease;
}
@keyframes slide{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
.card h2{
  font-size:1.15rem;font-weight:600;letter-spacing:-.01em;
  margin-bottom:14px;display:flex;align-items:center;gap:12px;
}
.card h2::before{
  content:"";width:4px;height:20px;border-radius:3px;
  background:linear-gradient(180deg,var(--accent),var(--accent2));
}
.card .lead{color:var(--muted);font-size:.9rem;margin-bottom:18px;}
.module-tag{
  display:inline-block;padding:4px 10px;border-radius:6px;
  font-size:.7rem;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;background:rgba(124,140,255,.15);
  color:var(--accent);margin-bottom:10px;
}

/* GRIDS */
.grid-mods{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:10px;margin:18px 0 8px;
}
.mod{
  padding:14px;border-radius:12px;border:1px solid var(--line);
  background:var(--soft);transition:.2s;
}
.mod:hover{border-color:rgba(124,140,255,.4);transform:translateY(-2px);}
.mod .n{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.mod .t{font-size:.92rem;font-weight:600;margin-top:4px;}
.mod .d{font-size:.75rem;color:var(--muted);margin-top:6px;}

.grid-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
.field label{
  display:block;font-size:.78rem;color:var(--muted);margin-bottom:6px;
  font-weight:500;text-transform:uppercase;letter-spacing:.05em;
}
.field input,.field select,.field textarea{
  width:100%;padding:11px 13px;border-radius:10px;
  border:1px solid var(--line);background:var(--bg2);color:var(--ink);
  font-size:.95rem;font-family:inherit;transition:.2s;
}
.field textarea{resize:vertical;min-height:90px;}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(124,140,255,.15);
}

/* SJT */
.sjt-scenario{
  background:var(--soft);border-left:3px solid var(--accent);
  padding:16px 18px;border-radius:10px;margin-bottom:18px;
  font-size:.95rem;color:#cfd6e8;
}
.sjt-opts{display:flex;flex-direction:column;gap:10px;}
.sjt-opt{
  padding:14px 16px;border:1px solid var(--line);border-radius:12px;
  cursor:pointer;transition:.18s;background:var(--bg2);font-size:.92rem;
  display:flex;gap:12px;align-items:flex-start;
}
.sjt-opt:hover{border-color:var(--accent);background:rgba(124,140,255,.06);}
.sjt-opt.sel{
  border-color:var(--accent);background:rgba(124,140,255,.12);
  box-shadow:0 0 0 1px var(--accent);
}
.sjt-opt .letter{
  flex-shrink:0;width:26px;height:26px;border-radius:8px;
  background:var(--line);color:var(--muted);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:.8rem;
}
.sjt-opt.sel .letter{background:var(--accent);color:#fff;}

/* LIKERT */
.q{display:grid;grid-template-columns:38px 1fr;gap:12px;padding:12px 8px;border-radius:10px;transition:.15s;}
.q:hover{background:var(--soft);}
.q .num{color:var(--muted);font-weight:600;font-size:.85rem;text-align:right;padding-top:3px;}
.q .txt{font-size:.92rem;}
.lik{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.lik label{
  flex:1;min-width:52px;padding:8px 4px;text-align:center;
  border:1px solid var(--line);border-radius:9px;cursor:pointer;
  font-size:.78rem;color:var(--muted);background:var(--bg2);
  transition:.15s;user-select:none;
}
.lik label:hover{border-color:var(--accent);color:var(--accent);}
.lik label.on{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-color:transparent;color:#fff;font-weight:600;
}

/* VIGNETTES */
.vign{
  background:linear-gradient(135deg,var(--card2),var(--bg2));
  border:1px solid var(--line);border-radius:14px;
  padding:20px;margin-bottom:16px;
}
.vign .vtext{font-size:.95rem;color:#cfd6e8;margin-bottom:14px;font-style:italic;}
.vign .vopts{display:flex;flex-direction:column;gap:8px;}
.vign .vopt{
  padding:12px 14px;border:1px solid var(--line);border-radius:10px;
  cursor:pointer;background:var(--bg);transition:.15s;font-size:.88rem;
}
.vign .vopt:hover{border-color:var(--accent);}
.vign .vopt.sel{border-color:var(--accent);background:rgba(124,140,255,.1);}

/* COGNITIVE */
.cog-stage{
  min-height:260px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;
  background:var(--bg2);border-radius:14px;padding:26px;
  border:1px solid var(--line);
}
.cog-prompt{font-size:.95rem;color:var(--muted);text-align:center;max-width:500px;}
.cog-stim{width:130px;height:130px;border-radius:50%;animation:pop .3s ease;}
@keyframes pop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
.cog-btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;}
.cog-btn{
  padding:14px 24px;border-radius:12px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);font-size:.95rem;font-weight:600;
  cursor:pointer;transition:.15s;font-family:inherit;min-width:120px;
}
.cog-btn:hover{border-color:var(--accent);transform:translateY(-2px);}
.cog-seq{display:flex;gap:14px;font-size:2.4rem;font-weight:700;color:var(--accent);letter-spacing:.1em;}
.cog-progress{width:100%;height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:14px;}
.cog-progress .f{height:100%;background:var(--accent);transition:width .3s;}
.pattern-choices{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;justify-content:center;}
.pattern-choice{
  width:60px;height:60px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg2);cursor:pointer;display:flex;align-items:center;
  justify-content:center;font-size:1.4rem;font-weight:700;transition:.15s;
}
.pattern-choice:hover{border-color:var(--accent);transform:translateY(-2px);}
.rt-fb{font-size:.8rem;color:var(--muted);margin-top:8px;text-align:center;font-variant-numeric:tabular-nums;}

/* ACTIONS */
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;}

/* REPORT */
.report{display:none;}
.report.show{display:block;animation:slide .4s ease;}
.score-hero{
  background:linear-gradient(135deg,#1b2340,#2a1b40);
  border:1px solid var(--line);border-radius:20px;
  padding:32px;display:grid;grid-template-columns:200px 1fr;
  gap:32px;align-items:center;margin-bottom:20px;
}
@media(max-width:640px){.score-hero{grid-template-columns:1fr;text-align:center;}}
.donut{position:relative;width:180px;height:180px;margin:0 auto;}
.donut svg{transform:rotate(-90deg);}
.donut .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut .val{
  font-size:2.6rem;font-weight:700;letter-spacing:-.03em;
  background:linear-gradient(135deg,#fff,#a5b4fc);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.donut .lbl{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.15em;}
.score-info h2{font-size:1.35rem;margin-bottom:8px;letter-spacing:-.02em;}
.score-info .lvl{
  display:inline-block;padding:5px 14px;border-radius:999px;
  font-size:.78rem;font-weight:600;letter-spacing:.05em;
  background:rgba(124,140,255,.2);color:#a5b4fc;
  border:1px solid rgba(124,140,255,.4);margin-bottom:12px;
}
.score-info p{color:var(--muted);font-size:.92rem;}
.sub{margin-bottom:18px;}
.sub .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px;}
.sub .head .n{font-size:.9rem;font-weight:600;}
.sub .head .v{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;}
.sub .track{height:9px;border-radius:999px;background:var(--line);overflow:hidden;}
.sub .track .f{height:100%;width:0;border-radius:999px;transition:width 1s cubic-bezier(.4,0,.2,1);}
.f.low{background:linear-gradient(90deg,#ff6b7a,#ff8b6b);}
.f.mid{background:linear-gradient(90deg,#f5b942,#f5d442);}
.f.good{background:linear-gradient(90deg,#22d3a5,#4ade80);}
.tag{
  font-size:.68rem;font-weight:600;padding:2px 8px;border-radius:999px;
  margin-left:8px;vertical-align:middle;letter-spacing:.03em;text-transform:uppercase;
}
.tag.res{background:rgba(34,211,165,.15);color:#22d3a5;}
.tag.def{background:rgba(255,107,122,.15);color:#ff6b7a;}
.tag.ok{background:rgba(124,140,255,.15);color:#a5b4fc;}
.rec{
  background:var(--soft);border-left:3px solid var(--accent);
  padding:14px 18px;border-radius:10px;margin-bottom:10px;
  font-size:.9rem;color:#cfd6e8;
}
.rec b{color:var(--accent);}
.rec.warn{border-left-color:var(--low);}
.rec.good{border-left-color:var(--good);}

/* SUBMIT BOX */
.submit-box{
  background:linear-gradient(160deg,var(--card2),var(--bg2));
  border:1px solid rgba(124,140,255,.35);border-radius:16px;
  padding:24px;margin-bottom:20px;
}
.submit-box h3{font-size:1rem;margin-bottom:10px;color:var(--accent);}
.submit-box p{color:#cfd6e8;font-size:.9rem;margin-bottom:16px;}
.consent{
  display:flex;gap:12px;align-items:flex-start;padding:14px;
  background:var(--bg);border:1px solid var(--line);
  border-radius:12px;margin-bottom:16px;cursor:pointer;transition:.15s;
}
.consent:hover{border-color:var(--accent);}
.consent input{display:none;}
.consent .box{
  flex-shrink:0;width:22px;height:22px;border-radius:6px;
  border:2px solid var(--line);background:var(--bg2);
  display:flex;align-items:center;justify-content:center;
  transition:.15s;margin-top:1px;
}
.consent input:checked + .box{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-color:transparent;
}
.consent input:checked + .box::after{content:"✓";color:#fff;font-weight:700;font-size:.85rem;}
.consent .txt{font-size:.86rem;color:#cfd6e8;line-height:1.5;}
.consent .txt b{color:var(--ink);}
.disclaimer{
  background:rgba(255,107,122,.05);
  border:1px solid rgba(255,107,122,.25);
  border-radius:12px;padding:16px;margin-bottom:20px;
  font-size:.82rem;color:#ffb0ba;line-height:1.5;
}
.disclaimer b{color:#ff8b98;}
.notice{
  background:rgba(245,185,66,.08);
  border:1px solid rgba(245,185,66,.3);
  color:#f5d442;padding:12px 16px;border-radius:10px;
  font-size:.85rem;margin-top:14px;
}
.notice.err{
  background:rgba(255,107,122,.08);
  border-color:rgba(255,107,122,.3);color:#ff8b98;
}
.notice.ok{
  background:rgba(34,211,165,.08);
  border-color:rgba(34,211,165,.3);color:#22d3a5;
}

/* FOOTER */
footer{
  text-align:center;padding:60px 20px 20px;
  border-top:1px solid var(--line);margin-top:60px;
  color:var(--muted);font-size:.82rem;
}
footer a{color:var(--accent);text-decoration:none;}
footer a:hover{text-decoration:underline;}
footer .brand{
  font-size:.95rem;font-weight:600;color:var(--ink);margin-bottom:8px;
  letter-spacing:-.01em;
}

.hidden{display:none!important;}

@media print{
  body{background:#fff;color:#000;padding:0;}
  .actions,.pwrap,.lang-switch,.hero-cta,.submit-box{display:none!important;}
  .card{border:1px solid #ccc;box-shadow:none;break-inside:avoid;background:#fff;color:#000;}
}
@media(max-width:640px){
  body{padding:12px 8px 40px;}
  .lang-switch{top:10px;right:10px;}
  .lang-switch button{padding:6px 12px;font-size:.72rem;}
  .hero{padding:60px 16px 30px;}
  .card{padding:18px;}
  .actions .btn{width:100%;justify-content:center;}
}
</style>
</head>
<body>

<div class="pwrap"><div class="pbar" id="pbar"></div></div>

<div class="lang-switch">
  <button data-lang-btn="ru" class="on">RU</button>
  <button data-lang-btn="en">EN</button>
</div>

<div class="wrap">

<!-- ================= LANDING ================= -->
<div id="view-landing">

  <header class="hero">
    <div class="hero-inner">
      <div class="logo"><span class="dot"></span> SAC PROJECT · v2.0</div>
      <h1 data-i18n="hero.title"></h1>
      <p data-i18n="hero.sub"></p>
      <div class="hero-cta">
        <button class="btn btn-p" id="startBtn" data-i18n="hero.cta"></button>
        <a href="#about" class="btn btn-g" data-i18n="hero.more"></a>
      </div>
      <div class="stats">
        <div class="stat"><div class="v">7</div><div class="l" data-i18n="hero.s1"></div></div>
        <div class="stat"><div class="v">5</div><div class="l" data-i18n="hero.s2"></div></div>
        <div class="stat"><div class="v">~25</div><div class="l" data-i18n="hero.s3"></div></div>
        <div class="stat"><div class="v">RU·EN</div><div class="l" data-i18n="hero.s4"></div></div>
      </div>
    </div>
  </header>

  <section id="about" class="card">
    <h2 data-i18n="about.title"></h2>
    <p class="lead" data-i18n="about.lead"></p>
    <div class="grid-mods">
      <div class="mod"><div class="n">01</div><div class="t" data-i18n="c.kog.t"></div><div class="d" data-i18n="c.kog.d"></div></div>
      <div class="mod"><div class="n">02</div><div class="t" data-i18n="c.emo.t"></div><div class="d" data-i18n="c.emo.d"></div></div>
      <div class="mod"><div class="n">03</div><div class="t" data-i18n="c.kom.t"></div><div class="d" data-i18n="c.kom.d"></div></div>
      <div class="mod"><div class="n">04</div><div class="t" data-i18n="c.vol.t"></div><div class="d" data-i18n="c.vol.d"></div></div>
      <div class="mod"><div class="n">05</div><div class="t" data-i18n="c.etp.t"></div><div class="d" data-i18n="c.etp.d"></div></div>
      <div class="mod"><div class="n">06</div><div class="t" data-i18n="c.est.t"></div><div class="d" data-i18n="c.est.d"></div></div>
      <div class="mod"><div class="n">07</div><div class="t" data-i18n="c.kar.t"></div><div class="d" data-i18n="c.kar.d"></div></div>
    </div>
  </section>

  <section class="card">
    <h2 data-i18n="modules.title"></h2>
    <p class="lead" data-i18n="modules.lead"></p>
    <div class="grid-mods">
      <div class="mod"><div class="n" data-i18n="m1.n"></div><div class="t" data-i18n="m1.t"></div><div class="d" data-i18n="m1.d"></div></div>
      <div class="mod"><div class="n" data-i18n="m2.n"></div><div class="t" data-i18n="m2.t"></div><div class="d" data-i18n="m2.d"></div></div>

function applyLang(){
  document.documentElement.lang = ST.lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const v = TEXTS[ST.lang][el.dataset.i18n];
    if(v !== undefined) el.innerHTML = v;
  });
  document.querySelectorAll("[data-lang-btn]").forEach(b=>b.classList.toggle("on",b.dataset.langBtn===ST.lang));
  renderSJT(); renderVign(); renderLik();
  if(ST.results) renderReport();
}
function setLang(l){
  ST.lang = l;
  try{localStorage.setItem("sac_lang",l);}catch(e){}
  applyLang();
}

function renderSJT(){
  const c = $("sjtContainer"); if(!c) return;
  c.innerHTML = "";
  SJT.forEach((it,i)=>{
    const blk = document.createElement("div");
    blk.style.marginBottom = "26px";
    const lbl = ST.lang==="ru" ? `Сценарий ${i+1} из ${SJT.length}` : `Scenario ${i+1} of ${SJT.length}`;
    blk.innerHTML = `
      <div style="font-size:.75rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;">${lbl}</div>
      <div class="sjt-scenario">${tr(it.s)}</div>
      <div class="sjt-opts">
        ${it.o.map((o,j)=>{
          const sel = ST.sjt[it.id]===j ? "sel" : "";
          const letters = ST.lang==="ru" ? "АБВГ" : "ABCD";
          return `<div class="sjt-opt ${sel}" data-sjt="${it.id}" data-idx="${j}"><div class="letter">${letters[j]}</div><div>${tr(o.t)}</div></div>`;
        }).join("")}
      </div>`;
    c.appendChild(blk);
  });
}
function renderVign(){
  const c = $("vignContainer"); if(!c) return;
  c.innerHTML = "";
  VIGN.forEach((it,i)=>{
    const blk = document.createElement("div");
    blk.className = "vign";
    const lbl = ST.lang==="ru" ? `Ситуация ${i+1} из ${VIGN.length}` : `Situation ${i+1} of ${VIGN.length}`;
    blk.innerHTML = `
      <div style="font-size:.72rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;">${lbl}</div>
      <div class="vtext">${tr(it.t)}</div>
      <div class="vopts">
        ${it.o.map((o,j)=>{
          const sel = ST.vign[it.id]===j ? "sel" : "";
          return `<div class="vopt ${sel}" data-vig="${it.id}" data-idx="${j}">${tr(o.t)}</div>`;
        }).join("")}
      </div>`;
    c.appendChild(blk);
  });
}
function renderLik(){
  const c = $("likContainer"); if(!c) return;
  c.innerHTML = "";
  LIK.forEach((it,i)=>{
    const blk = document.createElement("div");
    blk.className = "q";

    vo.classList.add("sel"); return; }

  if(lk){ ST.lik[lk.dataset.lik]=+lk.dataset.v;
    lk.parentElement.querySelectorAll("label").forEach(x=>x.classList.remove("on"));
    lk.classList.add("on"); }
});

const COLORS = [
  {n:{ru:"красный",en:"red"},h:"#ef4444"},
  {n:{ru:"синий",en:"blue"},h:"#3b82f6"},
  {n:{ru:"зелёный",en:"green"},h:"#22c55e"},
  {n:{ru:"жёлтый",en:"yellow"},h:"#eab308"}
];
const SHAPES = [
  {id:"circle",ru:"круг",en:"circle"},
  {id:"square",ru:"квадрат",en:"square"},
  {id:"triangle",ru:"треугольник",en:"triangle"}
];

function startSwitchTest(done){
  const TOTAL=16; let trial=0, correct=0, sumRT=0, t0=0;
  const stage=$("cogStageInner");
  function next(){
    if(trial>=TOTAL){done({acc:correct/TOTAL,meanRT:sumRT/Math.max(1,TOTAL)});return;}
    const rule = Math.floor(trial/4)%2===0 ? "color" : "shape";
    const c = COLORS[randInt(COLORS.length)], s = SHAPES[randInt(SHAPES.length)];
    const lbl = ST.lang==="ru"
      ? `Правило: <b style="color:var(--accent)">${rule==="color"?"ЦВЕТ":"ФОРМА"}</b> · Осталось: ${TOTAL-trial}`
      : `Rule: <b style="color:var(--accent)">${rule==="color"?"COLOR":"SHAPE"}</b> · Remaining: ${TOTAL-trial}`;
    stage.innerHTML = `
      <div class="cog-prompt">${lbl}</div>
      <div class="cog-stim" style="background:${c.h};${s.id==="circle"?"border-radius:50%;":s.id==="square"?"border-radius:14px;":"clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0;"}"></div>
      <div class="cog-btns">
        ${rule==="color"
          ? COLORS.map(x=>`<button class="cog-btn" data-ans="${x.n.en}">${x.n[ST.lang]}</button>`).join("")
          : SHAPES.map(x=>`<button class="cog-btn" data-ans="${x.id}">${x[ST.lang]}</button>`).join("")}
      </div>
      <div class="rt-fb" id="rtFb">…</div>`;
    t0 = performance.now();
    stage.querySelectorAll(".cog-btn").forEach(b=>{
      b.onclick = ()=>{
        const rt = performance.now()-t0; sumRT += rt;
        const ans = b.dataset.ans;
        const right = (rule==="color" && ans===c.n.en) || (rule==="shape" && ans===s.id);
        if(right) correct++;
        const fb = ST.lang==="ru" ? (right?`✓ верно · ${Math.round(rt)} мс`:`✗ ошибка · ${Math.round(rt)} мс`) : (right?`✓ correct · ${Math.round(rt)} ms`:`✗ error · ${Math.round(rt)} ms`);
        $("rtFb").textContent = fb;
        trial++; setTimeout(next, 320);
      };
    });
  }
  next();
}

  const stage=$("cogStageInner");
  function next(){
    if(i>=PATTERNS.length){done({score:correct/PATTERNS.length});return;}
    const p = PATTERNS[i];
    const pr = ST.lang==="ru" ? "Какое значение продолжает последовательность?" : "Which value continues the sequence?";
    const fb = ST.lang==="ru" ? "Выберите ответ" : "Choose an answer";
    stage.innerHTML = `
      <div class="cog-prompt">${pr}</div>
      <div class="cog-seq">${p.seq.map(x=>`<span>${x}</span>`).join("")}<span style="color:var(--accent);border-bottom:3px solid var(--accent);min-width:40px;">?</span></div>
      <div class="pattern-choices">${p.choices.map(ch=>`<div class="pattern-choice" data-p="${ch}">${ch}</div>`).join("")}</div>
      <div class="rt-fb" id="rtFb">${fb}</div>`;
    stage.querySelectorAll(".pattern-choice").forEach(el=>{
      el.onclick = ()=>{
        const right = el.dataset.p === p.next;
        if(right) correct++;
        $("rtFb").textContent = ST.lang==="ru" ? (right?"✓ верно":`✗ ответ: ${p.next}`) : (right?"✓ correct":`✗ answer: ${p.next}`);
        i++; setTimeout(next, 700);
      };
    });
  }
  next();
}

function startMemoryTest(done){
  const TOTAL=3; let round=0, correct=0;
  const stage=$("cogStageInner");
  function next(){
    if(round>=TOTAL){done({score:correct/TOTAL});return;}
    const len = 4+round;
    const seq = Array.from({length:len},()=>randInt(10));
    let idx = 0;
    const pr = ST.lang==="ru" ? "Запомните цифры и введите в <b>обратном</b> порядке." : "Memorize digits and enter in <b>reverse</b> order.";
    const rl = ST.lang==="ru" ? `Раунд ${round+1} из ${TOTAL}` : `Round ${round+1} of ${TOTAL}`;
    stage.innerHTML = `
      <div class="cog-prompt">${pr}</div>
      <div class="cog-seq" id="memSeq" style="font-size:3rem;">—</div>
      <div class="rt-fb" id="rtFb">${rl}</div>`;
    const seqEl = $("memSeq");
    const timer = setInterval(()=>{
      if(idx>=seq.length){
        clearInterval(timer);
        const ip = ST.lang==="ru" ? "Введите через запятую" : "Enter, comma-separated";
        const cb = ST.lang==="ru" ? "Проверить" : "Check";
        stage.innerHTML = `
          <div class="cog-prompt">${ip}</div>
          <input type="text" id="memInput" placeholder="..." style="padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--ink);font-size:1.1rem;text-align:center;letter-spacing:.1em;width:100%;max-width:400px;font-family:inherit;">
          <div class="cog-btns"><button class="cog-btn" id="memSubmit">${cb}</button></div>
          <div class="rt-fb" id="rtFb"></div>`;
        $("memSubmit").onclick = ()=>{
          const val = $("memInput").value.split(/[,\s]+/).map(x=>x.trim()).filter(Boolean);
          const exp = [...seq].reverse().map(String);
          const ok = val.length===exp.length && val.every((v,k)=>v===exp[k]);
          if(ok) correct++;
          $("rtFb").textContent = ST.lang==="ru" ? (ok?"✓ верно":`✗ правильно: ${exp.join(", ")}`) : (ok?"✓ correct":`✗ correct: ${exp.join(", ")}`);
          round++; setTimeout(next, 900);
        };
        return;
      }
      seqEl.textContent = seq[idx]; idx++;
    }, 700);
  }
  next();
}

function runCognitiveTests(){
  hide("cogIntro"); show("cogStage");
  const stage = $("cogStageInner");
  const btn = ST.lang==="ru" ? "Начать" : "Start";
  const t1 = ST.lang==="ru" ? "Тест 1: Переключение правил" : "Test 1: Rule Switching";
  const s1 = ST.lang==="ru" ? "Следите за правилом сверху." : "Follow the rule shown above.";
  stage.innerHTML = `<div class="cog-prompt"><b>${t1}</b><br>${s1}</div><div class="cog-btns"><button class="cog-btn" id="go1">${btn}</button></div>`;
  $("go1").onclick = ()=>{
    $("cogProg").style.width = "0%";
    startSwitchTest(r=>{
      ST.cog.switchAcc = r.acc; ST.cog.switchRT = r.meanRT;
      $("cogProg").style.width = "33%";
      const t2 = ST.lang==="ru" ? "Тест 2: Последовательности" : "Test 2: Sequences";
      const s2 = ST.lang==="ru" ? "Выберите элемент." : "Choose the element.";
      stage.innerHTML = `<div class="cog-prompt"><b>${t2}</b><br>${s2}</div><div class="cog-btns"><button class="cog-btn" id="go2">${btn}</button></div>`;
      $("go2").onclick = ()=>{
        startPatternTest(r=>{
          ST.cog.patternScore = r.score;
          $("cogProg").style.width = "66%";
          const t3 = ST.lang==="ru" ? "Тест 3: Рабочая память" : "Test 3: Working Memory";
          const s3 = ST.lang==="ru" ? "Введите в обратном порядке." : "Enter in reverse order.";
          stage.innerHTML = `<div class="cog-prompt"><b>${t3}</b><br>${s3}</div><div class="cog-btns"><button class="cog-btn" id="go3">${btn}</button></div>`;
          $("go3").onclick = ()=>{
            startMemoryTest(r=>{
              ST.cog.memScore = r.score;
              $("cogProg").style.width = "100%";
              const dn = ST.lang==="ru" ? "✓ Готово." : "✓ Done.";
              const nb = ST.lang==="ru" ? "Далее →" : "Next →";
              stage.innerHTML = `<div class="cog-prompt">${dn}</div><div class="cog-btns"><button class="cog-btn" id="toMod3">${nb}</button></div>`;
              $("toMod3").onclick = ()=>{ hide("mod2"); show("mod3"); window.scrollTo({top:0,behavior:"smooth"}); upd(3,5); };
            });
          };
        });
      };
    });
  };
}

/* =============================================================
   SCORING
   ============================================================= */
function scaleOfSJT(){
  const res = {};
  Object.keys(SCALES).forEach(k=>res[k]={sjt:[],lik:[],vign:[],cog:null,total:0,count:0});
  SJT.forEach(it=>{ const i=ST.sjt[it.id]; if(i===undefined) return;
    res[it.scale].sjt.push(it.o[i].s/3*100); });
  VIGN.forEach(it=>{ const i=ST.vign[it.id]; if(i===undefined) return;
    res[it.scale].vign.push(it.o[i].s/3*100); });
  LIK.forEach(it=>{ const v=ST.lik[it.id]; if(v===undefined) return;
    const adj = it.rev ? (6-v) : v;
    res[it.scale].lik.push((adj-1)/4*100); });
  res.kog.cog = ((ST.cog.switchAcc||0)+(ST.cog.patternScore||0))/2*100;
  res.vol.cog = (ST.cog.memScore||0)*100;
  Object.keys(res).forEach(k=>{
    const r = res[k];
    const parts = [...r.sjt,...r.vign,...r.lik, r.cog!==null?r.cog:null].filter(x=>x!==null&&x!==undefined);
    r.total = parts.length ? parts.reduce((a,b)=>a+b,0)/parts.length : 0;
    r.count = parts.length;
  });
  return res;
}
function levelOf(p){
  if(p<40) return {key:"low",label:T("level.low")};
  if(p<65) return {key:"mid",label:T("level.mid")};
  return {key:"good",label:T("level.good")};
}

function buildReport(){
  const sc = scaleOfSJT();
  const overall = Object.values(sc).reduce((a,r)=>a+r.total,0)/7;
  ST.results = {sc, overall};
  renderReport();
  show("report"); $("report").classList.add("show");
  $("pbar").style.width = "100%";
}

function renderReport(){
  const {sc, overall} = ST.results;
  const lvl = levelOf(overall);
  const arc = $("donutArc"), circ = 2*Math.PI*76;
  setTimeout(()=>{ arc.style.transition="stroke-dashoffset 1.4s ease";
    arc.style.strokeDashoffset = circ*(1-overall/100); }, 100);
  $("totPct").textContent = Math.round(overall)+"%";
  $("lvlLabel").textContent = (ST.lang==="ru"?"Уровень: ":"Level: ")+lvl.label;

  const sorted = Object.entries(sc).sort((a,b)=>b[1].total-a[1].total);
  const strong = sorted[0], weak = sorted[6];
  const intro = {
    ru:{
      low:"Ваш САК на низком уровне. В новых ситуациях может быть трудно. Но САК развивается: начните с малых проб и рефлексии.",
      mid:"У вас средний уровень САК. Есть рабочие стратегии, но некоторые компоненты требуют развития.",
      good:"У вас высокий уровень САК. Развитый репертуар метанавыков помогает входить в новые среды."
    },
    en:{
      low:"Your SAC is at a low level. New situations may feel difficult. But SAC develops: start with small trials and reflection.",
      mid:"You have a medium SAC level. Working strategies exist, but some components need development.",
      good:"You have a high SAC level. A developed repertoire helps you enter new environments."
    }
  }[ST.lang][lvl.key];

  $("summaryText").textContent = ST.lang==="ru"
    ? `${intro} Сильнейший — «${SCALES[strong[0]].ru}» (${Math.round(strong[1].total)}%), зона роста — «${SCALES[weak[0]].ru}» (${Math.round(weak[1].total)}%).`
    : `${intro} Strongest — "${SCALES[strong[0]].en}" (${Math.round(strong[1].total)}%), growth — "${SCALES[weak[0]].en}" (${Math.round(weak[1].total)}%).`;

  const subC = $("subscales"); subC.innerHTML = "";
  Object.keys(SCALES).forEach(k=>{
    const r = sc[k], l = levelOf(r.total), diff = r.total-overall;
    const tag = diff>=12 ? `<span class="tag res">${ST.lang==="ru"?"ресурс":"resource"}</span>`
              : diff<=-12 ? `<span class="tag def">${ST.lang==="ru"?"дефицит":"deficit"}</span>`
              : `<span class="tag ok">${ST.lang==="ru"?"баланс":"balanced"}</span>`;
    subC.innerHTML += `
      <div class="sub">
        <div class="head"><span class="n">${SCALES[k][ST.lang]} ${tag}</span><span class="v">${Math.round(r.total)}%</span></div>
        <div class="track"><div class="f ${l.key}" data-w="${r.total}" style="width:0%"></div></div>
        <div style="font-size:.78rem;color:var(--muted);margin-top:5px;">${SCALES[k][ST.lang+"D"]}</div>
      </div>`;
  });
  setTimeout(()=>subC.querySelectorAll(".f").forEach(f=>f.style.width = f.dataset.w+"%"), 200);

  const interp = $("interpretation");
  let iH = "";
  const strengths = sorted.filter(([k,r])=>r.total >= overall+8).slice(0,3);
  const weaks = sorted.filter(([k,r])=>r.total <= overall-8).slice(-3).reverse();
  const resLbl = ST.lang==="ru"?"Ваши ресурсы:":"Your resources:";
  const grLbl = ST.lang==="ru"?"Зоны роста:":"Growth areas:";
  if(strengths.length){
    iH += `<div class="rec good"><b>${resLbl}</b> ` + strengths.map(([k])=>`«${SCALES[k][ST.lang]}»`).join(", ") + `.</div>`;
  }
  if(weaks.length){
    iH += `<div class="rec warn"><b>${grLbl}</b> ` + weaks.map(([k])=>`«${SCALES[k][ST.lang]}»`).join(", ") + `.</div>`;
  }
  if(!iH) iH = `<div class="rec">${ST.lang==="ru"?"Профиль сбалансирован.":"Profile is balanced."}</div>`;
  interp.innerHTML = iH;

  const recs = ST.lang==="ru" ? {
    kog:"<b>Когнитивный:</b> дневник наблюдений за средой; разбирайте одну ситуацию в неделю.",
    emo:"<b>Эмоциональный:</b> дыхание 4-7-8; дневник эмоций; самосострадание.",
    kom:"<b>Коммуникативный:</b> «я-сообщения», активное слушание, границы.",
    vol:"<b>Волевой:</b> микрошаги 15 минут, Помодоро, трекер.",
    etp:"<b>Этико-правовой:</b> изучите ТК; тренируйте фразы отказа.",
    est:"<b>Эстетический:</b> замечайте 3 красивых объекта в день.",
    kar:"<b>Карьерный:</b> месячный анализ опыта; карта навыков."
  } : {
    kog:"<b>Cognitive:</b> observation journal; analyze one situation weekly.",
    emo:"<b>Emotional:</b> 4-7-8 breathing; emotion diary; self-compassion.",
    kom:"<b>Communicative:</b> I-messages, active listening, boundaries.",
    vol:"<b>Volitional:</b> 15-min micro-steps, Pomodoro, tracker.",
    etp:"<b>Ethico-legal:</b> study labor law; practice refusal phrases.",
    est:"<b>Aesthetic:</b> notice 3 beautiful objects daily.",
    kar:"<b>Career:</b> monthly experience analysis; skills map."
  };
  const rc = $("recommendations");
  const prLbl = ST.lang==="ru"?"Приоритетные направления:":"Priority areas:";
  let rH = `<h3 style="font-size:.95rem;margin:14px 0 10px;color:var(--accent);">${prLbl}</h3>`;
  sorted.slice(0,3).forEach(([k,r],i)=>{
    rH += `<div class="rec"><b>${i+1}. ${SCALES[k][ST.lang]} (${Math.round(r.total)}%)</b><br>${recs[k]}</div>`;
  });
  rc.innerHTML = rH;
}

/* =============================================================
   SUBMISSION
   ============================================================= */
const consentChk = $("consentChk");
consentChk.addEventListener("change", ()=>{ $("sendBtn").disabled = !consentChk.checked; });

function buildPayload(){
  const {sc, overall} = ST.results;
  const scores = {};
  Object.keys(sc).forEach(k=>{
    scores[k] = {
      name: SCALES[k].en,
      total: +sc[k].total.toFixed(2),
      sjt: sc[k].sjt.length ? +(sc[k].sjt.reduce((a,b)=>a+b,0)/sc[k].sjt.length).toFixed(2) : null,
      likert: sc[k].lik.length ? +(sc[k].lik.reduce((a,b)=>a+b,0)/sc[k].lik.length).toFixed(2) : null,
      vignette: sc[k].vign.length ? +(sc[k].vign.reduce((a,b)=>a+b,0)/sc[k].vign.length).toFixed(2) : null,
      cognitive: sc[k].cog
    };
  });
  return {
    lab: CONFIG.labName,
    version: CONFIG.version,
    timestamp: new Date().toISOString(),
    lang: ST.lang,
    contactEmail: $("contactEmail").value.trim() || null,
    demographics: ST.demo,
    scores,
    overallSAC: +overall.toFixed(2),
    cognitive: ST.cog,
    rawAnswers: {sjt: ST.sjt, vignettes: ST.vign, likert: ST.lik},
    reflections: {r1: ST.ref.r1, r2: ST.ref.r2, r3: ST.ref.r3}
  };
}

function setStatus(msg, type){
  $("sendStatus").innerHTML = msg ? `<div class="notice ${type||''}">${msg}</div>` : "";
}

$("sendBtn").addEventListener("click", async ()=>{
  if(!consentChk.checked){ setStatus(T("sub.needConsent"), "err"); return; }
  $("sendBtn").disabled = true;
  setStatus(T("sub.wait"), "");
  const payload = buildPayload();
  const endpoint = `https://formsubmit.co/ajax/${CONFIG.email}`;
  try{
    const resp = await fetch(endpoint, {
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify({
        _subject: `[${CONFIG.version}] New SAC result`,
        _template: "table",
        _captcha: "false",
        ...payload
      })
    });
    if(!resp.ok) throw new Error("HTTP "+resp.status);
    setStatus(T("sub.ok"), "ok");
  }catch(err){
    console.error(err);
    setStatus(T("sub.err"), "err");
    $("sendBtn").disabled = false;
  }
});

$("mailBtn").addEventListener("click", ()=>{
  if(!consentChk.checked){ setStatus(T("sub.needConsent"), "err"); return; }
  const payload = buildPayload();
  const subj = encodeURIComponent(`[${CONFIG.version}] SAC result`);
  const body = encodeURIComponent(JSON.stringify(payload, null, 2));
  window.location.href = `mailto:${CONFIG.email}?subject=${subj}&body=${body}`;
});
